[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["forge-std/=lib/forge-std/src/", "v4-core/=lib/v4-core/src/"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1_000_000
bytecode_hash = "none"

[fuzz]
runs = 512

[rpc_endpoints]
monad = "${MONAD_RPC_URL}"
